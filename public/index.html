<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kestrel digital twin</title>
<link rel="stylesheet" href="/vendor/fontsource/barlow/400.css">
<link rel="stylesheet" href="/vendor/fontsource/barlow/500.css">
<link rel="stylesheet" href="/vendor/fontsource/barlow/600.css">
<link rel="stylesheet" href="/vendor/fontsource/barlow-condensed/500.css">
<link rel="stylesheet" href="/vendor/fontsource/barlow-condensed/600.css">
<link rel="stylesheet" href="/styles.css">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"><canvas id="gl" aria-label="3D view of the plant"></canvas><div id="chips"></div></div>

<header class="top panel">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="#16232D" stroke-width="3"/><circle cx="17" cy="17" r="6.5" fill="#1D5F9A"/><g fill="#16232D"><circle cx="17" cy="6.6" r="1.3"/><circle cx="27.4" cy="17" r="1.3"/><circle cx="17" cy="27.4" r="1.3"/><circle cx="6.6" cy="17" r="1.3"/></g></svg>
    <div><h1>Kestrel Brake Works</h1><p>Line 2 digital twin</p></div>
  </div>
  <div class="status" id="status" data-m="stopped" aria-live="polite"><i></i><span>Connecting</span></div>
  <div class="clock"><span id="clock">--:--:--</span><small id="elapsed">shift time</small></div>
  <div class="controls" role="group" aria-label="Line control">
    <button id="bStart" data-cmd="start" title="Start production, or resume from pause"><svg viewBox="0 0 10 10"><path d="M1 0l9 5-9 5z"/></svg>Start</button>
    <button id="bPause" data-cmd="pause" title="Freeze the simulation (Space)"><svg viewBox="0 0 10 10"><path d="M1 0h3v10H1zM6 0h3v10H6z"/></svg>Pause</button>
    <button id="bStop" data-cmd="stop" title="Controlled stop: stations finish their cycle, AGVs finish their job"><svg viewBox="0 0 10 10"><path d="M0 0h10v10H0z"/></svg>Stop</button>
    <button id="bReset" data-cmd="reset" title="Clear all data and return to the start of the shift"><svg viewBox="0 0 10 10"><path d="M5 1a4 4 0 1 0 4 4H7.6A2.6 2.6 0 1 1 5 2.4V4l3-2.5L5 0z"/></svg>Reset</button>
  </div>
  <div class="speed">
    <label for="spRange">Speed</label>
    <input id="spRange" type="range" min="0" max="1000" step="1" value="650" aria-label="Simulation speed multiplier">
    <span class="spbox"><input id="spNum" type="number" min="0.1" max="120" step="0.1" value="10" aria-label="Speed multiplier, exact value"><b>×</b></span>
    <div class="seg" id="spPresets"><button data-s="1">1×</button><button data-s="10">10×</button><button data-s="30">30×</button><button data-s="60">60×</button><button data-s="120">120×</button></div>
  </div>
</header>

<nav class="rail panel" aria-label="Dashboards" id="rail"></nav>
<aside class="alarms" id="alarms" aria-live="polite"></aside>

<div class="viewctl panel">
  <div class="seg" id="views" role="group" aria-label="Camera view"><button data-v="plant" aria-pressed="true">Plant</button><button data-v="line">Line</button><button data-v="warehouse">Warehouse</button></div>
  <button id="bLabels" aria-pressed="true">Labels</button>
  <span class="hint">Drag to rotate, scroll to zoom, right-drag to pan, click anything for details</span>
</div>

<footer class="strip" id="strip" aria-label="Key figures"></footer>
<div id="tip" hidden></div>

<div class="back" id="back" hidden>
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><div><h2 id="mTitle"></h2><p id="mSub"></p></div><button class="x" id="mClose" aria-label="Close">×</button></header>
    <div class="body" id="mBody"></div>
  </section>
</div>
<div id="fail" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
